# Lint rules for the project. Based on very_good_analysis, with a few rules
# relaxed so the analyzer stays useful rather than noisy. CI runs
# `flutter analyze` and fails on any reported issue, including infos.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - lib/l10n/**          # generated by `flutter gen-l10n`
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Doc comments on every public member are not required in an app.
    public_member_api_docs: false
    # `dart format` keeps code at 80 columns; long string literals are fine.
    lines_longer_than_80_chars: false
    # Network code deliberately catches everything and surfaces it to the UI.
    avoid_catches_without_on_clauses: false
    # Small setter-style methods on services are used intentionally.
    use_setters_to_change_properties: false
    # TVDevice keeps mutable connection state but is keyed by host and MAC.
    avoid_equals_and_hash_code_on_mutable_classes: false
    # pubspec dependencies are grouped by purpose, not alphabetically.
    sort_pub_dependencies: false
    avoid_positional_boolean_parameters: false
