name: Release

# Builds signed Android APKs for a version tag and attaches them to the
# GitHub release. Signing material comes from repository secrets:
#   ANDROID_KEYSTORE_BASE64   base64 of the .keystore / .jks file
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
# Without them the job stops with a warning and publishes nothing, so a fork
# tagging its own releases never ships a debug-signed APK by accident.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    name: Signed Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; skipping the signed build."
          fi

      - name: Set up Java
        if: steps.signing.outputs.available == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        if: steps.signing.outputs.available == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.signing.outputs.available == 'true'
        run: flutter pub get

      - name: Write signing config
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APKs
        if: steps.signing.outputs.available == 'true'
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/symbols
          flutter build apk --release \
            --obfuscate --split-debug-info=build/symbols

      - name: Collect artifacts
        if: steps.signing.outputs.available == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" \
               "dist/smart-tv-remote-$VERSION-$abi.apk"
          done
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/smart-tv-remote-$VERSION-universal.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist

      - name: Release notes from CHANGELOG
        if: steps.signing.outputs.available == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            /^## \[/ { if (on) exit }
            on { print }
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "No CHANGELOG section for $VERSION." > dist/notes.md
          fi
          cat >> dist/notes.md <<'MD'

          ## Install

          Most phones want `arm64-v8a`. Pick `universal` if unsure. Open the
          APK on the phone and allow installs from this source when asked.
          MD

      - name: Publish GitHub release
        if: steps.signing.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: dist/notes.md
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Remove signing material
        if: always()
        run: rm -f android/app/release.keystore android/key.properties
